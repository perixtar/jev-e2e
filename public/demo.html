<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev test lab</title>
<style>body{font:16px system-ui;background:#f8f7f4;color:#252525;max-width:850px;margin:60px auto;padding:24px}button,input,select{font:inherit;padding:10px;margin:6px;border:1px solid #bbb;border-radius:6px}button{cursor:pointer;background:white}label{display:block;margin:14px 0}li{padding:18px;background:white;border:1px solid #ddd;margin:10px 0;list-style:none}ul{padding:0}nav{margin:24px 0}h1{letter-spacing:-1px}strong{margin-right:20px}[hidden]{display:none!important}:focus-visible{outline:3px solid #eb5b18;outline-offset:2px}</style>
<h1>Jev test lab</h1><p>A local app with projects, account settings, and asynchronous search.</p><main id="app"></main>
<script>
const app=document.querySelector('#app');let state,editId=null,searchVersion=0;
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data){const response=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});return {status:response.status,...await response.json()};}
async function load(){const result=await api('/api/state');if(result.status===401){login();return;}state=result;home();}
function login(){app.innerHTML='<form id="login"><h2>Sign in</h2><label>Email <input name="email" type="email" autocomplete="username"></label><label>Password <input name="password" type="password" autocomplete="current-password"></label><button>Sign in</button><p role="alert" id="error"></p></form>';document.querySelector('#login').onsubmit=async event=>{event.preventDefault();const form=new FormData(event.target);const result=await api('/api/login',{email:form.get('email'),password:form.get('password')});if(result.ok){history.replaceState(null,'','/projects');load();}else document.querySelector('#error').textContent=result.error;};}
function home(){const settings=location.pathname==='/settings';app.innerHTML='<h2>Welcome back</h2><nav><button id="projects">Projects</button><button id="settings">Settings</button></nav><section id="workspace"></section>';document.querySelector('#projects').onclick=()=>{history.replaceState(null,'','/projects');projects();};document.querySelector('#settings').onclick=()=>{history.replaceState(null,'','/settings');preferences();};if(settings)preferences();else projects();}
function projects(){document.querySelector('#workspace').innerHTML='<h2>Projects</h2><button id="new">New project</button><div id="form"></div><label>Status filter <select id="filter"><option>All</option><option>Active</option><option>Archived</option></select></label><label>Search projects <input id="search" type="search"></label><p role="status" id="loading"></p><ul aria-label="Projects" id="records"></ul>';document.querySelector('#new').onclick=()=>editor();document.querySelector('#filter').onchange=search;document.querySelector('#search').oninput=search;render(state.projects);}
function render(items){document.querySelector('#records').innerHTML=items.map(item=>'<li><strong>'+escape(item.name)+'</strong><span>'+escape(item.status)+'</span><button data-rename="'+item.id+'">Rename</button><button data-archive="'+item.id+'">Archive</button></li>').join('');document.querySelectorAll('[data-rename]').forEach(button=>button.onclick=()=>editor(state.projects.find(item=>item.id===Number(button.dataset.rename))));document.querySelectorAll('[data-archive]').forEach(button=>button.onclick=async()=>{const result=await api('/api/archive',{id:Number(button.dataset.archive)});state.projects=result.projects;render(state.projects);});}
function editor(item){editId=item?.id??null;document.querySelector('#form').innerHTML='<form id="editor"><label>Project name <input name="name" value="'+escape(item?.name??'')+'"></label><button>Save project</button><p role="alert" id="validation"></p></form>';document.querySelector('#editor').onsubmit=async event=>{event.preventDefault();const name=new FormData(event.target).get('name');const result=await api('/api/projects',{id:editId,name});if(result.error){document.querySelector('#validation').textContent=result.error;}else{state.projects=result.projects;document.querySelector('#form').innerHTML='';render(state.projects);}};}
async function search(){const version=++searchVersion;document.querySelector('#loading').textContent='Loading projects';const result=await api('/api/search?q='+encodeURIComponent(document.querySelector('#search').value)+'&status='+encodeURIComponent(document.querySelector('#filter').value));if(version!==searchVersion)return;document.querySelector('#loading').textContent='';render(result.projects);}
function preferences(){document.querySelector('#workspace').innerHTML='<h2>Settings</h2><label>Theme <select id="theme"><option>Light</option><option>Dark</option></select></label><label><input id="notifications" type="checkbox"> Enable notifications</label>';document.querySelector('#theme').value=state.theme;document.querySelector('#notifications').checked=state.notifications;document.querySelector('#theme').onchange=async event=>{state.theme=event.target.value;await api('/api/settings',{theme:state.theme});};document.querySelector('#notifications').onchange=async event=>{state.notifications=event.target.checked;await api('/api/settings',{notifications:state.notifications});};}
load();
</script></html>
